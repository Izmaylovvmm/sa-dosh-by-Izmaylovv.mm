<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Са Дош — Игровая комната</title>
    <link rel="stylesheet" href="style.css?v=9">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="room-body">

    <img src="voti.jpg" alt="" style="position:fixed; inset:0; width:100%; height:100%; object-fit:cover; opacity:0.22; pointer-events:none; z-index:0;">

    <div class="top-bar" style="position:relative; z-index:1; display:flex; justify-content:space-between; align-items:center; padding:8px 12px; gap:6px;">
        <div style="display:flex; align-items:center; gap:8px; min-width:0;">
            <span class="logo-text" style="font-weight:900; color:#10b981; white-space:nowrap;">СА ДОШ</span>
            <span id="roomCodeBadge" onclick="copyRoomLink()" title="Нажми, чтобы скопировать ссылку" style="background:#14221b; border:1px solid #23332b; color:#f4f6f5; font-size:11px; padding:3px 7px; border-radius:6px; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">🔑 ...</span>
        </div>
        <div style="display:flex; align-items:center; gap:8px; flex-shrink:0;">
            <span id="timerField" style="font-weight:800; color:#f59e0b; font-size:13px;">⏱️ 120с</span>
            <button onclick="exitRoom()" style="background:#dc2626; color:#fff; border:none; border-radius:6px; padding:5px 9px; font-size:11px; font-weight:700; cursor:pointer;">🚪 Выйти</button>
        </div>
    </div>

    <div id="teamScoreBar" style="position:relative; z-index:1; display:none; background:#111c16; border-bottom:1px solid #23332b; padding:6px 12px; justify-content:space-between; align-items:center; font-size:12px;">
        <div style="color:#10b981; font-weight:800;">🟢 Магас: <span id="greenScoreVal">0</span></div>
        <button id="switchTeamBtn" style="background:#1f2937; color:#f4f6f5; border:1px solid #374151; border-radius:5px; padding:3px 8px; font-size:11px; cursor:pointer; font-weight:700;">🔄 Сменить команду</button>
        <div style="color:#f59e0b; font-weight:800;">🟡 Джейрах: <span id="goldScoreVal">0</span></div>
    </div>

    <div class="main-content" style="position:relative; z-index:1;">
        <div class="game-board" style="position:relative;">
            <div id="reactionLayer" class="reaction-layer"></div>
            <div id="gameStatus" style="font-size:11px; color:#9ca3af; text-transform:uppercase; letter-spacing:1px;">Ожидание игроков</div>
            <div id="roleTitle" style="font-size:13px; font-weight:800; color:#10b981; margin-top:4px;">ДОБРО ПОЖАЛОВАТЬ</div>
            <div id="wordDisplay" style="font-size:26px; font-weight:900; color:#ffffff; margin:8px 0;">Са Дош</div>
            <div id="roleDescription" style="font-size:12px; color:#d1d5db; line-height:1.4;">Нажмите «Начать раунд», когда соберутся игроки.</div>

            <div id="podiumBox" style="display:none; margin-top:10px; background:rgba(15, 25, 20, 0.95); border:1px solid #f59e0b; border-radius:10px; padding:10px;">
                <div style="font-size:12px; font-weight:800; color:#f59e0b; margin-bottom:6px;">🏆 ПОДИУМ ПОБЕДИТЕЛЕЙ (ТОП-3)</div>
                <div id="podiumList" style="display:flex; flex-direction:column; gap:5px; font-size:12px;"></div>
            </div>

            <div style="display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-top:10px;">
                <button id="startRoundBtn" class="main-btn" style="padding:10px 20px; font-size:13px; width:auto;">▶️ Начать раунд</button>
                <button id="giveUpBtn" style="display:none; background:#dc2626; color:#fff; border:none; border-radius:8px; padding:8px 14px; font-size:12px; font-weight:700; cursor:pointer;">🏳️ Сдаться</button>
                <button id="voteSkipBtn" style="display:none; background:#374151; color:#f4f6f5; border:1px solid #4b5563; border-radius:8px; padding:8px 12px; font-size:12px; font-weight:700; cursor:pointer;">⏭️ Сменить слово (0/0)</button>
                <button id="spoilerBtn" style="display:none; background:#991b1b; color:#fecaca; border:1px solid #ef4444; border-radius:8px; padding:8px 12px; font-size:12px; font-weight:700; cursor:pointer;">⚠️ Спойлер (-5)</button>
            </div>
        </div>

        <div id="leaderboard" class="leaderboard-panel">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                <span id="userCountField" style="font-size:12px; font-weight:800; color:#10b981;">Игроков: 0</span>
                <span id="speakerBadge" style="display:none; background:rgba(239,68,68,0.2); border:1px solid #ef4444; color:#fca5a5; font-size:10px; font-weight:700; padding:2px 6px; border-radius:99px;">🎙️ <span id="speakerName"></span></span>
            </div>
            <div id="usersList" class="users-list-scroll"></div>
        </div>

        <div class="chat-container">
            <div id="chatMessages" class="chat-messages"></div>

            <div class="reactions-bar">
                <button id="emoji1" class="emoji-btn">🔥</button>
                <button id="emoji2" class="emoji-btn">😂</button>
                <button id="emoji3" class="emoji-btn">😮</button>
                <button id="emoji4" class="emoji-btn">☝️</button>
            </div>

            <div class="chat-input-bar">
                <button id="micBtn" class="mic-btn" title="Включить / выключить микрофон">🎙️</button>
                <input type="text" id="messageInput" placeholder="Введите слово или подсказку..." autocomplete="off">
                <button id="sendBtn" class="send-btn">➤</button>
            </div>
        </div>
    </div>

    <script src="room.js?v=40"></script>
</body>
</html>
